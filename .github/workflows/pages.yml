name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download terrain data release
        env:
          TERRAIN_DATA_RELEASE: terrain-data-v1.1.0
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/ilmatila-terrain"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TERRAIN_DATA_RELEASE}"
          mkdir -p "$download_dir" public/terrain/areas
          curl --fail --silent --show-error --location --retry 3 \
            "$release_url/SHA256SUMS.txt" --output "$download_dir/SHA256SUMS.txt"
          for area in paijanne vironlahti ilomantsi kuusamo; do
            curl --fail --silent --show-error --location --retry 3 \
              "$release_url/$area.zip" --output "$download_dir/$area.zip"
          done
          (cd "$download_dir" && sha256sum --check SHA256SUMS.txt)
          for area in paijanne vironlahti ilomantsi kuusamo; do
            unzip -q "$download_dir/$area.zip" -d public/terrain/areas
          done

      - name: Build site
        run: npm run build -- --base=/ilmatila/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
