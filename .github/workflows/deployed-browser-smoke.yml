name: Deployed browser smoke

on:
  workflow_call:
    inputs:
      base_url:
        description: Deployed site URL, with a trailing slash
        required: true
        type: string
      asset_base_path:
        description: URL path under which the production build serves shared assets
        required: true
        type: string
      build_info_url:
        description: URL to the deployment's build-info.json
        required: true
        type: string
      expected_commit:
        description: Source commit that must be deployed
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the expected source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install desktop browsers
        run: npx playwright install --with-deps chrome msedge firefox webkit

      - name: Start virtual audio output
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pulseaudio pulseaudio-utils
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/ilmatila-xdg-runtime"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ilmatila-ci
          pactl set-default-sink ilmatila-ci
          pactl info

      - name: Verify deployed build identity
        run: node tools/release/verify-deployed-build.mjs "$BUILD_INFO_URL" "$EXPECTED_COMMIT"
        env:
          BUILD_INFO_URL: ${{ inputs.build_info_url }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}

      - name: Run the production browser matrix against the deployed URL
        run: xvfb-run --auto-servernum npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
          PLAYWRIGHT_ASSET_BASE_PATH: ${{ inputs.asset_base_path }}

      - name: Upload browser smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deployed-browser-smoke-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
